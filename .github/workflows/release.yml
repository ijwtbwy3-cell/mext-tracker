name: Релиз (APK + исходники)

# Автоматический релиз: запушить тег — получить Release с APK.
#   git tag v1.0.0 && git push origin v1.0.0
# Либо вручную: Actions → «Релиз (APK + исходники)» → Run workflow → указать тег.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Проверки (числа, бюджеты, фокус, магазин, офлайн-хранилище)
        run: |
          npx tsc --noEmit
          npm run verify
          npm run smoke:offline

      - name: Офлайн-бандл (Vite)
        run: npm run build:offline

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          
      - name: Android SDK 36
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager=$SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager не найден"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          for PKG in "platform-tools" "platforms;android-36" "build-tools;36.0.0"; do
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$PKG" > /dev/null 2>&1 \
              && echo "ok: $PKG" || echo "пропущено (уже есть): $PKG"
          done
          echo "Платформы: $(ls "$SDK_ROOT/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "Build-tools: $(ls "$SDK_ROOT/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Платформа Android (папка android/ не хранится в репозитории)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          chmod +x android/gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          npx cap sync android

      - name: Иконки и сплэши (пиксельная M, фон #a855f7)
        run: |
          npx @capacitor/assets generate --android --assetPath assets-src \
            --iconBackgroundColor "#a855f7" --splashBackgroundColor "#12081f"
          find android/app/src/main/res -name ic_launcher_background.xml \
            -exec sed -i 's/#FFFFFF/#A855F7/g' {} +

      - name: Версия из тега
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Сборка APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../mext-tracker-${VERSION}.apk"

      - name: Архив исходников
        run: git archive --format=zip --prefix=mext-tracker/ -o "mext-tracker-source-${VERSION}.zip" HEAD

      - name: Контрольные суммы
        run: sha256sum ./*.apk ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Публикация Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MEXT Трекер ${{ env.RELEASE_TAG }}
          body_path: .github/release-template.md
          files: |
            mext-tracker-*.apk
            mext-tracker-source-*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
